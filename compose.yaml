services:
  api:
    build:
      context: .
      dockerfile: infra/docker/server.Dockerfile
    env_file:
      - ${SERVER_ENV_FILE:-./apps/server/.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      CORS_ALLOWED_ORIGINS: http://localhost:8080
      MEDIA_LOCAL_DIR: /app/apps/server/data/media
      FFMPEG_PATH: ffmpeg
    volumes:
      - mira-media:/app/apps/server/data/media
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: ''
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mira-media:
